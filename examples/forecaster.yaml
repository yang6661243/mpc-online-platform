# ============================================================
# 负荷预测模型配置
# 用法：
#   python -m microgrid.forecaster --config examples/forecaster.yaml --profile example_factory_holiday_base
#   python -m microgrid.forecaster --config examples/forecaster.yaml --profile example_factory_holiday_weather
# ============================================================

active_profile: example_factory_holiday_base # 当前默认启用的配置档案名称；命令行 --profile 可覆盖

profiles: # 配置档案集合；每个子项是一套可独立运行的参数
  # 示例工厂：2022年1-11月训练，12月留给MPC验证。
  example_factory_holiday_base: # 配置档案名称；运行时可用 --profile 指定
    model: # 负荷预测模型参数
      type: lightgbm_recursive # 模型类型，例如递归预测或直接多步预测
      horizon_steps: 192 # 预测/优化时域步数；15分钟粒度下 192 步为 48 小时
      min_history_steps: 672 # 训练/预测所需的最少历史步数
    data: # 训练或评估数据配置
      file: scenarios/example_factory_train_jan_nov_2022.xlsx # 输入数据文件路径
      sheet: load_15min # 使用的 Excel 工作表名称
      train_ratio: 0.9 # 训练集比例；剩余部分用于验证/回测
    model_path: outputs/models/example_factory_holiday_base.joblib # 训练后保存或 MPC 读取的模型文件路径
    train_ratio: 0.9 # 训练集比例；剩余部分用于验证/回测
    evaluate: # 预测模型评估与回测配置
      horizon_steps: 192 # 预测/优化时域步数；15分钟粒度下 192 步为 48 小时
      backtest_every: 96 # 回测起点间隔步数；数值越小评估越密集
      eval_excel: outputs/example_factory_holiday_base_evaluation.xlsx # 评估结果输出 Excel 文件路径
    covariates: # 训练阶段使用的外部协变量配置
      holiday_calendar_file: scenarios/china_public_holiday_calendar_2022.xlsx # 节假日/调休日历文件路径
      holiday_calendar_sheet: calendar # 节假日日历所在工作表
    features: # 特征工程配置
      lags: [1, 2, 3, 96, 672] # 滞后特征步数列表，例如 96 表示前一天同一时刻
      rolling_windows: [96] # 滚动统计窗口步数列表
      calendar: true # 是否启用日历类特征
      cyclical: true # 是否启用周期编码特征，如小时/星期的 sin-cos 编码
      external_columns: # 参与训练/预测的外部协变量列名列表
        - is_public_holiday # 是否法定节假日
        - is_weekend # 是否自然周末
        - is_adjusted_workday # 是否调休工作日
        - is_day_before_holiday # 是否节假日前一天
        - is_day_after_holiday # 是否节假日后一天

