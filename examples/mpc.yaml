# ============================================================
# MPC配置
# 用法：
#   python -m microgrid.mpc --config examples/mpc.yaml --profile example_factory_holiday_base
#   python -m microgrid.mpc --config examples/mpc.yaml --profile example_factory_holiday_weather
# ============================================================

active_profile: example_factory_holiday_base # 默认运行哪个策略；命令行 --profile 会覆盖它

# 配置读取规则：
# 1. defaults 是公共底座，所有 profiles 默认继承这里的参数。
# 2. profiles.<策略名> 只写该策略和 defaults 不同的参数。
# 3. 如果 defaults 和 profile 里有同名参数，以 profile 为准。
# 4. 所以调某个策略时，优先看 profiles.<策略名>；那里没写的参数才回到 defaults 找。
# 例：defaults.mpc.horizon_steps=192，但 example_factory_holiday_base.mpc.horizon_steps=96，
#     运行 --profile example_factory_holiday_base 时，最终生效的是 96。
defaults:
  battery: # 储能电池公共参数
    capacity_kwh: 783 # 电池额定容量，单位 kWh
    charge_max_kw: 375 # 最大充电功率，单位 kW
    discharge_max_kw: 375 # 最大放电功率，单位 kW
    soc_init: 0.5 # 初始 SOC，0.5 表示 50%
    soc_min: 0.1 # SOC 下限；MPC 执行时不能低于该值
    soc_max: 0.9 # SOC 上限；MPC 执行时不能高于该值
    charge_eff: 0.95 # 充电效率
    discharge_eff: 0.95 # 放电效率

  device: # 负荷、光伏、风电换算参数
    load_base_kw: 630 # 负荷基准；当输入负荷为比例值时，用它换算成 kW
    pv_capacity_kw: 0 # 光伏装机容量，单位 kW；0 表示该场景不使用光伏
    pv_efficiency: 0 # 光伏出力折减系数
    wind_capacity_kw: 0 # 风电装机容量，单位 kW；0 表示该场景不使用风电
    wind_efficiency: 0 # 风电出力折减系数

  grid: # 并网约束公共参数
    anti_backflow: true # 是否防逆流；true 表示禁止向电网反送电
    import_max_kw: 5000 # 最大购电功率上限，单位 kW
    export_max_kw: 0 # 最大售电/上网功率上限，单位 kW
    transformer_capacity_kw: 5000 # 变压器容量或需量容量上限，单位 kW/kVA

  cost: # 电费和成本公共参数
    c_deg: 0.05 # 储能充放电损耗/衰减成本，单位 元/kWh
    demand_rate: 39.0 # 需量电费单价，单位 元/kW/月
    capacity_rate: 0 # 容量电费单价，单位 元/kVA/月；0 表示不计
    billing_days: 31 # 计费周期天数；按月仿真时通常为 30 或 31

  mpc: # MPC 滚动优化公共默认参数；profile.mpc 没写的项会从这里继承
    days: 31 # 仿真天数
    horizon_steps: 192 # 每次滚动优化看到的未来步数；15分钟粒度下 192 步为 48 小时
    forecast_mode: lightgbm # 负荷预测模式；lightgbm 使用训练好的负荷预测模型
    start_step: 0 # 从场景数据的第几个 15 分钟步开始运行
    peak_slack_penalty: 5000 # 超过目标峰值的软约束惩罚；越大越不愿超峰
    target_peak_mode: manual # 目标峰值来源；manual 表示使用 target_peak_kw
    target_peak_kw: 389.2 # 手动目标峰值，单位 kW；非 manual 模式可设为 null
    reserve_soc_enabled: false # 旧版三档 SOC 备用策略开关；当前优先使用 reserve_energy_enabled
    reserve_soc_normal: 0.10 # 普通时段 SOC 备用下限
    reserve_soc_risk: 0.25 # 风险时段 SOC 备用下限
    reserve_soc_high: 0.35 # 高风险时段 SOC 备用下限
    reserve_margin_risk_kw: 60 # 距目标峰值小于该裕度时进入风险档，单位 kW
    reserve_margin_high_kw: 30 # 距目标峰值小于该裕度时进入高风险档，单位 kW
    reserve_energy_enabled: true # 是否按预测误差估计峰前备用电量
    reserve_error_quantile: 0.90 # 使用历史低估误差的分位数作为风险冲击量
    reserve_error_lookback_days: 3 # 计算预测误差时回看最近天数
    reserve_error_warmup_kw: 40 # 误差样本不足时采用的保守冲击量，单位 kW
    reserve_error_min_kw: 10 # 预测误差冲击量下限，单位 kW
    reserve_error_max_kw: 80 # 预测误差冲击量上限，单位 kW
    reserve_error_min_samples: 96 # 信任历史分位数前所需的最少误差样本数
    reserve_lead_hours: 2 # 预测峰值前提前多少小时准备备用电量
    reserve_slack_penalty: 20 # 备用电量不足的惩罚系数，单位 元/kWh
    vpp_realtime_discharge_compensation: true # 是否允许实时用储能补偿负荷预测低估

  vpp: # 虚拟电厂/需求响应公共参数
    enabled: false # 是否启用虚拟电厂响应
    charge_price: 0.2 # VPP 响应收益/补贴价格，单位 元/kWh
    start_hour: 11 # VPP 响应窗口开始小时，24小时制
    end_hour: 13 # VPP 响应窗口结束小时，24小时制
    baseline_days: 5 # 计算需求响应基线使用的历史天数
    steps_per_day: 96 # 每天步数；15分钟粒度为 96
    response_cap_kw: null # 需求响应功率上限，null 表示不额外限制

  forecast_history: # 负荷预测模型运行时需要的历史负荷来源
    unit: ratio # 历史负荷单位；ratio 表示比例值，kw 表示已是功率值

  forecast_covariates: # 预测阶段的外部协变量来源
    holiday_calendar_sheet: calendar # 节假日 Excel 工作表名
    future_weather_sheet: weather # 天气 Excel 工作表名

profiles: # 每个策略的覆盖配置；只写和 defaults 不同的部分
  example_factory_holiday_base: # 示例工厂：只加节假日协变量，不加天气
    scenario: # MPC 验证场景数据
      data_file: scenarios/example_factory_mpc_dec2022.xlsx # 12月验证场景文件
      sheets:
        load: load_dec # 12月真实负荷
        pv_wind: pv_dec # 12月光伏/风电出力
        price: price # 电价表
    mpc: # 当前策略的 MPC 覆盖项；这里写的会覆盖 defaults.mpc
      horizon_steps: 96 # 快跑验证用 24 小时时域；正式可改回 192
      model_path: outputs/models/example_factory_holiday_base.joblib # 只加节假日的负荷预测模型
      enable_battery_power_smoothing: true # 只给 MPC 开启电池功率平滑；普通求解器不受影响
      battery_ramp_limit_kw: 150 # 平滑参数：MPC 每15分钟电池净功率最大变化，越小越平滑
      battery_smooth_penalty: 0.01 # 平滑参数：电池功率变化惩罚，越大越平滑，但可能牺牲削峰
    forecast_history:
      data_file: scenarios/example_factory_mpc_dec2022.xlsx # 用 1-11 月历史负荷作为预测参考
      sheet: train_jan_nov
    forecast_covariates:
      holiday_calendar_file: scenarios/china_public_holiday_calendar_2022.xlsx # 2022年节假日/调休日历
    output: outputs/example_factory_mpc_holiday_base_dec2022.xlsx # 结果输出文件

  example_factory_holiday_weather: # 示例工厂：节假日 + 天气协变量
    scenario:
      data_file: scenarios/example_factory_mpc_dec2022.xlsx # 12月验证场景文件
      sheets:
        load: load_dec # 12月真实负荷
        pv_wind: pv_dec # 12月光伏/风电出力
        price: price # 电价表
    mpc: # 当前策略的 MPC 覆盖项；这里写的会覆盖 defaults.mpc
      model_path: outputs/models/example_factory_holiday_weather.joblib # 节假日 + 天气的负荷预测模型
      enable_battery_power_smoothing: true # 只给 MPC 开启电池功率平滑；普通求解器不受影响
      battery_ramp_limit_kw: 100 # 平滑参数：MPC 每15分钟电池净功率最大变化，越小越平滑
      battery_smooth_penalty: 0.01 # 平滑参数：电池功率变化惩罚，越大越平滑，但可能牺牲削峰
    forecast_history:
      data_file: scenarios/example_factory_mpc_dec2022.xlsx # 用 1-11 月历史负荷作为预测参考
      sheet: train_jan_nov
    forecast_covariates:
      holiday_calendar_file: scenarios/china_public_holiday_calendar_2022.xlsx # 2022年节假日/调休日历
      future_weather_file: scenarios/example_factory_weather_dec_2022_open_meteo.xlsx # 12月天气协变量
    output: outputs/example_factory_mpc_holiday_weather_dec2022.xlsx # 结果输出文件

  aodelai_weather: # 奥德来：天气协变量版本
    scenario:
      data_file: scenarios/aodelai1_mpc_format.xlsx # 奥德来 MPC 场景文件
      sheets:
        load: load_apr # 验证月负荷
        pv_wind: pv_apr # 验证月光伏/风电
        price: price # 电价表
    device:
      load_base_kw: 1300 # 奥德来负荷比例换算基准
      pv_capacity_kw: 1000 # 奥德来光伏装机容量
      pv_efficiency: 1 # 光伏出力折减系数
    cost:
      billing_days: 30 # 奥德来验证月按 30 天计费
    mpc: # 当前策略的 MPC 覆盖项；这里写的会覆盖 defaults.mpc
      days: 30 # 运行 30 天
      model_path: outputs/models/aodelai_direct_weather.joblib # 奥德来天气负荷预测模型
      target_peak_mode: oracle_full_period # 回测用：用全周期最优峰值作为目标峰值
      target_peak_kw: null # oracle_full_period 模式下不手动填目标峰值
      reserve_margin_risk_kw: 120 # 奥德来负荷规模更大，风险裕度相应放大
      reserve_margin_high_kw: 60 # 高风险裕度，单位 kW
      reserve_error_warmup_kw: 100 # 误差样本不足时采用的保守冲击量
      reserve_error_min_kw: 30 # 误差冲击量下限
      reserve_error_max_kw: 150 # 误差冲击量上限
    forecast_history:
      data_file: scenarios/aodelai1_mpc_format.xlsx # 训练期/参考期历史负荷
      sheet: train_mar
    forecast_covariates:
      holiday_calendar_file: scenarios/china_public_holiday_calendar_2026.xlsx # 2026年节假日/调休日历
      future_weather_file: scenarios/aodelai_weather_forecast_open_meteo_may.xlsx # 奥德来验证月天气协变量
    output: outputs/奥德来mcp策略_天气协变量.xlsx # 结果输出文件

  hehong_weather: # 和宏：天气协变量 + VPP
    scenario:
      data_file: scenarios/hehonghuajin.xlsx # 和宏 MPC 场景文件
      sheets:
        load: load_apr # 验证月负荷
        pv_wind: pv_apr # 验证月光伏/风电
        price: price # 电价表
    device:
      load_base_kw: 1000 # 和宏负荷比例换算基准
      pv_capacity_kw: 350 # 和宏光伏装机容量
      pv_efficiency: 0.95 # 光伏出力折减系数
    cost:
      billing_days: 30 # 和宏验证月按 30 天计费
    mpc: # 当前策略的 MPC 覆盖项；这里写的会覆盖 defaults.mpc
      days: 30 # 运行 30 天
      model_path: outputs/models/hehonghuajin_direct_weather.joblib # 和宏天气负荷预测模型
      target_peak_mode: oracle_full_period # 回测用：用全周期最优峰值作为目标峰值
      target_peak_kw: null # oracle_full_period 模式下不手动填目标峰值
      reserve_margin_risk_kw: 120 # 和宏负荷规模更大，风险裕度相应放大
      reserve_margin_high_kw: 60 # 高风险裕度，单位 kW
      reserve_error_warmup_kw: 100 # 误差样本不足时采用的保守冲击量
      reserve_error_min_kw: 30 # 误差冲击量下限
      reserve_error_max_kw: 150 # 误差冲击量上限
    vpp:
      enabled: true # 和宏 profile 开启虚拟电厂响应
    forecast_history:
      data_file: scenarios/hehonghuajin.xlsx # 训练期/参考期历史负荷
      sheet: train_mar
    forecast_covariates:
      holiday_calendar_file: scenarios/china_public_holiday_calendar_2026.xlsx # 2026年节假日/调休日历
      future_weather_file: scenarios/hehong_weather_forecast_open_meteo_apr.xlsx # 和宏验证月天气协变量
    output: outputs/奥德来mcp策略.xlsx # 结果输出文件
