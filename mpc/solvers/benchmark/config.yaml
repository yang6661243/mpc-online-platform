# 离线最优调度基准 — 求解器配置文件
# 用法: python scenarios/run_benchmark.py
#  或:  result = solve_benchmark_from_yaml("benchmark_config.yaml", instance_id="xxx")

# ═══════════════════════════════════════════════════════
# 求解参数
# ═══════════════════════════════════════════════════════
solver:
  days: 30             # 求解天数（取场景数据前N天）
  use_milp: true       # 是否MILP（充放互斥），true=MILP, false=LP
  verbose: true        # 打印求解过程日志

# ═══════════════════════════════════════════════════════
# 场景文件路径
# ═══════════════════════════════════════════════════════
scenario:
  pv_wind_file: "mpc/scenarios/风电、光电_示例.xlsx"    # 辐照度 + 风速
  load_file: "mpc/scenarios/真实负荷_VIC_对齐时间线.xlsx"   # 真实负荷 (VIC对齐)
  price_file: "mpc/scenarios/电价曲线_示例.csv"         # 购/售电价

# ═══════════════════════════════════════════════════════
# 设备容量（与沙盘 InstanceConfig 默认值一致）
# ═══════════════════════════════════════════════════════
device:
  pv_capacity_kw: 80         # 光伏装机容量 (kW)
  pv_efficiency: 0.95        # 光伏组件效率
  wind_capacity_kw: 50       # 风电装机容量 (kW)
  wind_efficiency: 0.92      # 风电效率
  load_base_kw: 110           # 负荷基准功率 (kW)

# ═══════════════════════════════════════════════════════
# 储能电池参数
# ═══════════════════════════════════════════════════════
battery:
  capacity_kwh: 200        # 电池总容量 (kWh)
  charge_max_kw: 100       # 最大充电功率 (kW)
  discharge_max_kw: 100    # 最大放电功率 (kW)
  soc_min: 0.10            # SOC 下限 (0~1)
  soc_max: 0.95            # SOC 上限 (0~1)
  soc_init: 0.50           # 初始 SOC (0~1)
  charge_eff: 0.95         # 充电效率 (0~1)
  discharge_eff: 0.95      # 放电效率 (0~1)

# ═══════════════════════════════════════════════════════
# 电网约束参数
# ═══════════════════════════════════════════════════════
grid:
  import_max_kw: 100             # 最大购电功率 (kW)
  export_max_kw: 100             # 最大售电/上网功率 (kW)
  transformer_capacity_kw: 200   # 变压器容量上限 (kW)
  anti_backflow: false           # 防逆流: true=禁止上网, false=允许

# ═══════════════════════════════════════════════════════
# 成本参数
# ═══════════════════════════════════════════════════════
cost:
  c_deg: 0.05                    # 储能循环衰减成本 (元/kWh 吞吐)
  c_pv: 0.0                         # 光伏度电分成成本 (元/kWh)，0=不计
  c_wind: 0.0                       # 风电度电分成成本 (元/kWh)，0=不计
  demand_rate: 35.0                 # 需量费率 (元/kW/月)
  capacity_rate: 25.0                # 容量费率 (元/kVA/月)
  optimization_billing_days: 30     # MPC优化用，新增峰值按月度价值计价
  battery_unit_cost: 0.0            # 电池单位造价 (元/kWh)，用于计算日历衰减
  battery_annual_decay_rate: 0.0    # 电池年折旧率 (小数，如0.02=2%/年)